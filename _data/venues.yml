  description: "Tex-Mex restaurant and bar with cocktails, large screens for sports, and a garden event space. The Texan handles dinner and karaoke; The Garden Club is the outdoor garden area for brunches, parties, and events."
  description_pt: "Restaurante e bar Tex-Mex com cocktails, ecrãs grandes para desporto e um espaço de jardim para eventos. O Texan trata dos jantares e do karaoke; o Garden Club é a zona ao ar livre para brunchs, festas e eventos."
  weekly:
    - day: Friday
      day_pt: Sexta-feira
      name: Karaoke Night
      name_pt: Noite de Karaoke
    - day: Saturday
      day_pt: Sábado
      name: Karaoke Night
      name_pt: Noite de Karaoke
  links:
    - { label: "Website", label_pt: "Site", url: "https://www.thetexan.pt" }
    - { label: "Instagram (Texan)", label_pt: "Instagram (Texan)", url: "https://www.instagram.com/thetexanbar/" }
    - { label: "Instagram (Garden Club)", label_pt: "Instagram (Garden Club)", url: "https://www.instagram.com/thegardenclub.angra/" }
  reservation_url: "https://the-texan-1755256381.resos.com/booking"
  reservation_label: "Make a dinner reservation"
  reservation_label_pt: "Reservar uma mesa"
  schema_type: Restaurant

