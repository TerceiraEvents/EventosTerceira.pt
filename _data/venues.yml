- name: "Museu de Angra do Heroísmo"
  name_en: "Angra do Heroísmo Museum"
  address: "Ladeira de São Francisco, 9700-182 Angra do Heroísmo"
  map_url: "https://www.google.com/maps/search/?api=1&query=Museu+de+Angra+do+Hero%C3%ADsmo"
  description: "Regional museum housed in the former Convent of São Francisco. Permanent exhibition 'Of Sea and Land: A History of the Atlantic' covers the role of Terceira and the Azores in Portuguese history; the museum also programs temporary exhibitions, talks, concerts (Sundays with Music), book clubs, and family activities. Closed Mondays and public holidays."
  description_pt: "Museu regional instalado no antigo Convento de São Francisco. Exposição permanente 'Do Mar e da Terra: Uma História no Atlântico' sobre o papel da Terceira e dos Açores na história portuguesa; programa também exposições temporárias, palestras, concertos (Domingos com Música), clubes de leitura e atividades para famílias. Encerra à segunda-feira e feriados."
  links:
    - { label: "Website", label_pt: "Site", url: "https://museu-angra.cultura.azores.gov.pt/" }
    - { label: "Facebook", label_pt: "Facebook", url: "https://www.facebook.com/MuseuDeAngraDoHeroismo/" }
  schema_type: Museum
  category: arts-culture

- name: "Terceira Weaving Cabin / Ebru Art Terceira"
  address: "EN1-1A 57, 9700 Terceira (exact directions provided on booking)"
  address_pt: "EN1-1A 57, 9700 Terceira (indicações exatas fornecidas após reserva)"
  map_url: "https://maps.app.goo.gl/U4vEqFN4na9VXLSq8"
  description: "Small-group craft studio on Terceira offering Ebru water marbling (paint on water, transfer to fabric, paper, wood, or ceramic) and private weaving lessons on traditional looms. Beginners and experienced weavers welcome; tea or coffee served on the covered terrace. Booking required; sessions cap at four people."
  description_pt: "Atelier de pequenos grupos na Terceira com workshops de Ebru (pintura sobre água, transferência para tecido, papel, madeira ou cerâmica) e aulas privadas de tecelagem em teares tradicionais. Aberto a iniciantes e tecelões experientes; chá ou café servidos na esplanada coberta. Marcação prévia; sessões até quatro pessoas."
  weekly:
    - day: "Tuesday, Thursday, Saturday"
      day_pt: "Terça, Quinta, Sábado"
      name: "Weaving lessons, 14:00–17:00 (by appointment)"
      name_pt: "Aulas de tecelagem, 14:00–17:00 (mediante marcação)"
  description_after_weekly: "Ebru sessions run by appointment year-round (typical start 14:00). Bookings via Instagram, Airbnb Experiences, Viator, or Pelago."
  description_after_weekly_pt: "Sessões de Ebru por marcação ao longo do ano (início habitual às 14:00). Reservas pelo Instagram, Airbnb Experiences, Viator ou Pelago."
  links:
    - { label: "Instagram", label_pt: "Instagram", url: "https://www.instagram.com/ebruartterceira/" }
    - { label: "Airbnb Experience (Ebru)", label_pt: "Experiência Airbnb (Ebru)", url: "https://www.airbnb.co.uk/experiences/6879500" }
