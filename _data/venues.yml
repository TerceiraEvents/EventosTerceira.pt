- name: "CCCAH (Centro Cultural e de Congressos)"
  address: "Canada Nova, Santa Luzia, 9700-178 Angra do Heroísmo"
  map_url: "https://www.google.com/maps/search/?api=1&query=Centro+Cultural+e+de+Congressos+Angra+do+Hero%C3%ADsmo"
  description: "Angra's main cultural and conference center, converted from the former bullring. Hosts cinema screenings, music festivals, exhibitions, and conferences. Home to Festival Termómetro and regular film programming."
  description_pt: "Principal centro cultural e de congressos de Angra, convertido a partir da antiga praça de touros. Recebe sessões de cinema, festivais de música, exposições e conferências. Casa do Festival Termómetro e da programação regular de cinema."
  links:
    - { label: "Website", label_pt: "Site", url: "https://angradoheroismo.pt/local/centro-cultural-e-de-congressos-de-angra-do-heroismo/" }
    - { label: "Tickets (Ticketline)", label_pt: "Bilhetes (Ticketline)", url: "https://ticketline.sapo.pt/en/salas/sala/1294" }
  schema_type: PerformingArtsTheater

