# Shared tag vocabulary for special events.
#
# `slug` is what goes into each event's `tags:` list and is used for
# filtering in the URL (e.g. /calendar?tag=kid-friendly). `label` and
# `emoji` drive the UI pill and dropdown. `label_pt` provides the
# Portuguese label; templates fall back to `label` when missing.
#
# Keep this list in sync with:
#   - TerceiraEventsApp     src/utils/tags.js (slugs+emojis only;
#                            labels live in src/i18n/strings.*.js)
#   - event-submit-worker   src/tags.js
#
- slug: kid-friendly
  label: Kid Friendly
  label_pt: Para Crianças
  emoji: 👶
- slug: live-music
  label: Live Music
  label_pt: Música ao Vivo
  emoji: 🎵
- slug: cinema
  label: Cinema
  label_pt: Cinema
  emoji: 🎬
- slug: theater
  label: Theater
  label_pt: Teatro
  emoji: 🎭
- slug: dance
  label: Dance
  label_pt: Dança
  emoji: 💃
- slug: nightlife
