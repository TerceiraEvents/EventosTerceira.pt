- day: Sunday
  day_pt: Domingo
  events:
  - name: Poesia/Prosa ao Crepúsculo
    venue: Lar Doce Livro
    address: Rua de São João 22-24, 9700-184 Angra do Heroísmo
    map_url: https://www.google.com/maps/search/?api=1&query=Lar+Doce+Livro+Angra+do+Heroísmo
    time: "18:00"
    description: "Weekly literary gathering coordinated by Valter Peres with a regular group. The name alternates between Poesia (poetry) and Prosa (prose) depending on the week's format, but it's the same recurring event. Lar Doce Livro describes it as the gathering that defines them most."
    description_pt: "Encontro literário semanal coordenado por Valter Peres com um grupo habitual. O nome alterna entre Poesia e Prosa consoante o formato da semana, mas é o mesmo encontro recorrente. O Lar Doce Livro descreve-o como o encontro que mais os define."
    note: "Posted a few days in advance on Instagram."
    note_pt: "Anunciado com alguns dias de antecedência no Instagram."
    instagram: https://www.instagram.com/livraria_lardocelivro/
    url: https://www.lardocelivro.pt
  - name: Cine-Clube da Ilha Terceira
    venue: Recreio dos Artistas
    address: Rua Recreio dos Artistas, Sé, 9700 Angra do Heroísmo
    map_url: https://www.google.com/maps/search/?api=1&query=Recreio+dos+Artistas+Angra+do+Heroísmo
    time: "18:00"
    description: "Weekly film club screening classic and art-house films. Runs seasonally — typically January through May, and September through December. Check their Facebook page for each season's schedule and the week's film."
    description_pt: "Cineclube semanal com sessões de clássicos e cinema de autor. Funciona por temporadas — habitualmente de janeiro a maio e de setembro a dezembro. Vê a página de Facebook para a programação da temporada e o filme da semana."
    note: "Facebook-only presence — no Instagram account. Season dates announced on their Facebook page at the start of each season."
    note_pt: "Apenas no Facebook — sem conta de Instagram. As datas da temporada são anunciadas no início de cada temporada na página de Facebook."
    url: https://www.facebook.com/cineclubeilhaterceira
