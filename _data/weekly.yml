- day: Thursday
  day_pt: Quinta-feira
  events:
  - name: Latin Night
    name_pt: Noite Latina
    venue: Tasca do Camões
    time: "20:30"
    description: Weekly Latin night
    description_pt: Noite latina semanal
    note: "Salsa lesson at 19:00 with instructor Liliana Passos (@familiadancante) precedes the general Latin dancing from 20:30. Instructors stay around afterwards to help newcomers, so you can come with no prior dance experience."
    note_pt: "Aula de salsa às 19:00 com a instrutora Liliana Passos (@familiadancante) antes da dança latina aberta a partir das 20:30. Os instrutores ficam depois para ajudar quem chega de novas, por isso podes ir sem qualquer experiência de dança."
    address: Rua Da Rocha 64, 9700-169 Angra do Heroísmo

    map_url: https://www.google.com/maps/search/?api=1&query=Tasca+do+Camões+Angra+do+Heroísmo
- day: Friday
  day_pt: Sexta-feira
  events:
  - name: Karaoke Night
    name_pt: Noite de Karaoke
    venue: The Texan
    address: Rua Carreira dos Cavalos 37, 9700-167 Angra do Heroísmo
    map_url: https://www.google.com/maps/search/?api=1&query=The+Texan+Angra+do+Heroísmo
    time: "22:30"
    description: "Very popular! It often fills up at the start but seats open up around 23:30–midnight, so worth checking in later or grabbing a drink at the Texan bar while you wait."
    description_pt: "Muito popular! Costuma encher logo no início mas por volta das 23:30 à meia-noite começa a abrir lugares — vale a pena passar mais tarde ou tomar um copo no bar do Texan enquanto esperas."
    note: "Reservations are for dinner, not karaoke — if you reserve, you are expected to order dinner. Last dinner reservation is at 21:00. Reservations are cancelled 15 minutes after the set time, so you need to arrive by 21:15 at the latest. If you reserve at 21:00 and show up at 22:30 for karaoke, your reservation will already be cancelled!"
    note_pt: "As reservas são para jantar, não para karaoke — se reservas, é à conta do jantar. A última reserva de jantar é às 21:00. As reservas são canceladas 15 minutos depois da hora marcada, por isso tens de chegar até às 21:15. Se reservares para as 21:00 e apareceres às 22:30 só para o karaoke, a tua reserva já estará cancelada!"
    url: https://www.thetexan.pt
  - name: Live Act Night
    name_pt: Noite ao Vivo
    venue: Havanna Club Terceira
    address: Porto das Pipas, 9700 Angra do Heroísmo
    map_url: https://www.google.com/maps/search/?api=1&query=Havanna+Club+Terceira+Angra+do+Heroísmo
    time: "21:30"
    description: Weekly live DJ night at Havanna Club. Each week features a warm-up DJ plus a headline live act.
    description_pt: Noite semanal de DJs ao vivo no Havanna Club. Todas as semanas tem um DJ de aquecimento e um cabeça de cartaz ao vivo.
    note: "The lineup changes every week — check their Instagram (@havannaangra) to see who's playing."
    note_pt: "O cartaz muda todas as semanas — vê o Instagram (@havannaangra) para saberes quem toca."
    instagram: https://www.instagram.com/havannaangra/
  - name: 90s & 2000s Night
    name_pt: Noite Anos 90 & 2000
    venue: Porta 42
    address: Rua de São João, Angra do Heroísmo
    map_url: https://www.google.com/maps/search/?api=1&query=Porta+42+Angra+do+Heroísmo
    time: "21:30"
    description: "Bar specialising in 90s and 2000s music. Themed banner varies week to week (Rock/Pop Rock, 90s & 2000s Vibes, etc.). Check Instagram for the week's lineup."
    description_pt: "Bar dedicado a música dos anos 90 e 2000. O tema varia semana a semana (Rock/Pop Rock, 90s & 2000s Vibes, etc.). Vê o Instagram para o tema da semana."
    note: "Doors at 21:30. Sometimes closed when Friday is a holiday; on long weekends they occasionally shift the slot to a Thursday instead."
    note_pt: "Abre às 21:30. Às vezes fecha quando a sexta calha em feriado; em fins-de-semana prolongados às vezes passa para quinta-feira."
    instagram: https://www.instagram.com/porta_42/
  - name: Concerto ao Vivo
    venue: Lar Doce Livro
    address: Rua de São João 22-24, 9700-184 Angra do Heroísmo
    map_url: https://www.google.com/maps/search/?api=1&query=Lar+Doce+Livro+Angra+do+Heroísmo
    time: "21:00"
    description: "Weekly live music. House artists rotate (Pedro Xavier and João da Ilha both play regularly); the specific artist varies week to week."
    description_pt: "Música ao vivo semanal. Os artistas da casa rodam (o Pedro Xavier e o João da Ilha tocam com regularidade); o artista da semana varia."
    note: "Check Instagram for this week's artist; usually posted 1 to 2 days in advance."
    note_pt: "Vê o Instagram para saberes o artista da semana; normalmente é anunciado com 1 ou 2 dias de antecedência."
    instagram: https://www.instagram.com/livraria_lardocelivro/
    url: https://www.lardocelivro.pt
  - name: Club Night
    name_pt: Noite de Club
    venue: Twins Club
    address: Rua Diogo de Teive 54, 9700-065 Angra do Heroísmo
    map_url: https://www.google.com/maps/search/?api=1&query=Twins+Club+Angra+do+Heroísmo
    time: "00:00"
    description: "Two-floor club nights with a headlining DJ + warm-up. Reopened in May 2026 after a temporary closure."
    description_pt: "Noites de clube em dois pisos com um DJ principal e um warm-up. Reabriu em maio de 2026 após uma pausa."
    note: "Doors at midnight; the lineup changes each week. Check Instagram (@twinstheclub) for who's playing."
    note_pt: "Abre à meia-noite; o cartaz muda todas as semanas. Vê o Instagram (@twinstheclub) para saberes quem toca."
    instagram: https://www.instagram.com/twinstheclub/

