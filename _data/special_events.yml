- date: 2026-06-13
  id: 860ac225-ec5a-4f32-bf14-256d0d4373bd
  name: "ESCAMA: de peixe 1#"
  name_en: "ESCAMA: Fish 1#"
  venue: Espaço AMIT
  address: Av. Tenente Coronel José Agostinho 6-A, 9700-108 Angra do Heroísmo
  map_url: https://www.google.com/maps/search/?api=1&query=Academia+Musical+Ilha+Terceira+Angra+do+Heroísmo
  festival: "ESCAMA"
  description: "After Borboleta, we now dive into another skin. More intimate. Calmer. More immersive. A gathering built around listening, detail and slow movement — between strings, warm textures, deep rhythms and music that unfolds without rushing. On June 13th, Espaço AMIT transforms once again for another ESCAMA night. Line-up: Jonathan Afonso (contemporary folk from Terceira Island, where tradition, emotion and Atlantic identity meet in a raw, intimate take on song); O GAJO (Viola Campaniça, Mediterranean pulse and modern folk straight from Lisbon — a free journey between traditional and urban soundscapes); JLSMOOTH (a deep house vinyl set driven by warm, elegant and hypnotic grooves); and TECHCRICKET (a return to vinyl and to the roots — deep, physical techno shaped between Andorra and Barcelona). Outside the circuit. Inside the island."
  description_pt: "Depois de Borboleta, mergulhamos agora noutra pele. Mais íntima. Mais calma. Mais imersiva. Um encontro pensado para a escuta, para o detalhe e para o movimento lento — entre cordas, texturas quentes, ritmos profundos e música que se constrói sem pressa. No dia 13 de junho, o Espaço AMIT volta a transformar-se para mais uma noite ESCAMA. Line-up: Jonathan Afonso (folk contemporâneo da Ilha Terceira, onde tradição, emoção e identidade atlântica se cruzam numa abordagem crua e intimista da canção); O GAJO (Viola Campaniça, pulsação mediterrânica e folk moderno vindo de Lisboa — uma viagem livre entre o tradicional e o urbano); JLSMOOTH (Deep House em Vinyl Set, guiado por grooves quentes, elegantes e hipnóticos); e TECHCRICKET (regresso ao vinil e às origens — techno profundo e físico, das influências entre Andorra e Barcelona). Fora do circuito. Dentro da ilha."
  organizer: "AAIP — Associação de Artistas Independentes de Portugal"
  instagram: https://www.instagram.com/aaipazores/
  tags:
  - live-music
  - nightlife

