  description: "Bibliographic exhibition curated by the Biblioteca Pública e Arquivo Regional Luís da Silva Ribeiro (in its 70th-anniversary year), with a selection of works on the historic, cultural, architectural, and traditional moments that shaped Angra do Heroísmo's identity — a city that has held UNESCO World Heritage status since 1983. The exhibition charts how Angra has positioned itself as an Atlantic-rooted city open to the world, hosting cultural, artistic and community expressions in a dialogue between tradition and modernity. Open through 30 June; free entry."
