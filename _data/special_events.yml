- name: "ESCAMA: de borboleta 2#"
  id: f4106bde-f02b-404d-913f-8e0e5ed7547e
  name_pt: "ESCAMA: de borboleta 2#"
  name_en: "ESCAMA: de borboleta 2#"
  date: 2026-09-12
  time: "20:00"
  venue: "Auditório AMIT"
  map_url: "https://maps.app.goo.gl/z5Zgh6SBcU9bPZRb7"
  description: "Depois de uma pausa durante julho e agosto, o ESCAMA volta a mudar de pele. No dia 12 de setembro, às 20h, regressamos à AMIT para mais uma edição do ESCAMA: de borboleta 2#. mulheres que criam · mulheres que ocupam Desta vez, a Borboleta é feita inteiramente por mulheres. Cinco propostas, cinco linguagens e cinco formas diferentes de ocupar o espaço artístico: Rita Evangelho, Ervas Danadinhas, Andreia Simões & Kitsunitsu, AZIA e GIRA. Começamos pela exposição de Rita Evangelho, passamos pela poesia e música das Ervas Danadinhas, seguimos para a performance musical de Andreia Simões & Kitsunitsu, recebemos AZIA, rapper e produtora do Porto, e fechamos a noite com o techno de GIRA. Pela primeira vez na Terceira, recebemos AZIA. Rapper e produtora do Porto, desenvolve um trabalho autoral onde se cruzam escrita, produção musical e experimentação sonora. Azia — sintoma de males maiores — manifesta-se através da MPC e da voz. Uma nova voz, uma nova realidade e mais uma ponte entre o que acontece cá e o que acontece lá fora. Uma noite feita de mulheres que criam · mulheres que ocupam. 12 de setembro · 20h · AMIT 10 € não sócios · 8 € sócios Esta edição conta com o apoio da Câmara Municipal de Angra do Heroísmo e da Associação Cultural Burra de Milho, e com a parceria da AMIT, que volta a abrir-nos as portas."
  description_pt: "Depois de uma pausa durante julho e agosto, o ESCAMA volta a mudar de pele. No dia 12 de setembro, às 20h, regressamos à AMIT para mais uma edição do ESCAMA: de borboleta 2#. mulheres que criam · mulheres que ocupam Desta vez, a Borboleta é feita inteiramente por mulheres. Cinco propostas, cinco linguagens e cinco formas diferentes de ocupar o espaço artístico: Rita Evangelho, Ervas Danadinhas, Andreia Simões & Kitsunitsu, AZIA e GIRA. Começamos pela exposição de Rita Evangelho, passamos pela poesia e música das Ervas Danadinhas, seguimos para a performance musical de Andreia Simões & Kitsunitsu, recebemos AZIA, rapper e produtora do Porto, e fechamos a noite com o techno de GIRA. Pela primeira vez na Terceira, recebemos AZIA. Rapper e produtora do Porto, desenvolve um trabalho autoral onde se cruzam escrita, produção musical e experimentação sonora. Azia — sintoma de males maiores — manifesta-se através da MPC e da voz. Uma nova voz, uma nova realidade e mais uma ponte entre o que acontece cá e o que acontece lá fora. Uma noite feita de mulheres que criam · mulheres que ocupam. 12 de setembro · 20h · AMIT 10 € não sócios · 8 € sócios Esta edição conta com o apoio da Câmara Municipal de Angra do Heroísmo e da Associação Cultural Burra de Milho, e com a parceria da AMIT, que volta a abrir-nos as portas."
  description_en: "After a break during July and August, ESCAMA is shedding its skin again. On 12 September at 8 PM, we return to AMIT for another edition of ESCAMA: de borboleta 2#. women who create · women who occupy This time, the Butterfly is made entirely by women. Five proposals, five languages and five different ways of occupying artistic space: Rita Evangelho, Ervas Danadinhas, Andreia Simões & Kitsunitsu, AZIA and GIRA. We begin with an art exhibition by Rita Evangelho, followed by the poetry and music of Ervas Danadinhas, then a musical performance by Andreia Simões & Kitsunitsu. We welcome AZIA, a rapper and producer from Porto, before GIRA closes the night with techno. For the first time in Terceira, we welcome AZIA. A rapper and producer from Porto, she develops an authorial practice where writing, music production and sonic experimentation come together. Azia — a symptom of greater ailments — manifests itself through the MPC and the voice. A new voice, a new reality, and another bridge between what happens here and what happens elsewhere. A night made of women who create · women who occupy. 12 September · 8 PM · AMIT €10 non-members · €8 members This edition is supported by Câmara Municipal de Angra do Heroísmo and Associação Cultural Burra de Milho, in partnership with AMIT, who once again open their doors to us."
  tags:
    - live-music
    - dance
    - exhibition
    - literature
    - theater
    - nightlife


