- date: 2026-06-23
  name: "Noite de São João — Desfile das Marchas (Sanjoaninas 2026)"
  name_en: "Noite de São João — Marches Parade (Sanjoaninas 2026)"
  venue: "Centro histórico de Angra do Heroísmo"
  address: "Alto das Covas → Rua da Sé → Rua de São João → Rua dos Minhas Terras → Rua Direita → Praça Velha"
  map_url: https://www.google.com/maps/search/?api=1&query=Pra%C3%A7a%20Velha%20Angra%20do%20Hero%C3%ADsmo
  time: "21:00"
  festival: "Sanjoaninas 2026"
  description: "Noite de São João — the longest and rowdiest night of the year in Angra. 34 adult marches parade along the full historic-centre route (Alto das Covas → Sé → São João → Minhas Terras → Direita → Praça Velha), led off by the Marcha Oficial das Sanjoaninas 2026 («Angra e a Açorianidade», Banda do Senhor Santo Cristo de Toronto). Afterwards, the traditional sardinhada and São João bonfires on Rua de São João. All four stages active deep into the morning; Bailão is DJs only tonight (Vitor 00:00, Wild do Ó 01:30, Brothers On Dish 03:00). Street animation with Transformers and Style Punk (Icarus et Lumen) 19:00–21:00."
  description_pt: "Noite de São João — a noite mais longa e barulhenta do ano em Angra. 34 marchas de adultos desfilam pelo percurso completo (Alto das Covas → Sé → São João → Minhas Terras → Direita → Praça Velha), abertas pela Marcha Oficial das Sanjoaninas 2026 («Angra e a Açorianidade», Banda do Senhor Santo Cristo de Toronto). A seguir, tradicional sardinhada e fogueiras de São João na Rua de São João. Quatro palcos ativos até de madrugada; só DJs no Bailão esta noite (Vitor à 00h00, Wild do Ó à 01h30, Brothers On Dish às 03h00). Animação de rua com Transformers e Style Punk (Icarus et Lumen) das 19h às 21h."
  tags:
  - outdoor
  - free
  - live-music
  - kid-friendly

