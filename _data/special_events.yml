- date: 2026-06-13
  name: "ESCAMA: de Peixe — Jonathan Afonso (Folk Contemporâneo)"
  name_en: "ESCAMA: de Peixe — Jonathan Afonso (Contemporary Folk)"
  venue: Espaço AMIT
  address: Av. Tenente Coronel José Agostinho 6-A, 9700-108 Angra do Heroísmo
  map_url: https://www.google.com/maps/search/?api=1&query=Academia+Musical+Ilha+Terceira+Angra+do+Heroísmo
  festival: "ESCAMA"
  description: "First night of ESCAMA: de Peixe at Espaço AMIT — solo concert by Jonathan Afonso, the Terceira-based guitarist who treats music as language, meditation and freedom. Self-taught, he moves between contemporary folk, fingerstyle, traditional guitar, flamenco, and more progressive offshoots, exploring how music alters space, time and perception. His sets are improvisatory and intimate: the same piece breathes differently every night."
  description_pt: "Primeira noite do ESCAMA: de Peixe no Espaço AMIT — concerto a solo de Jonathan Afonso, o guitarrista terceirense que aproxima-se da música como linguagem, meditação e liberdade. Autodidata, percorre diferentes paisagens sonoras entre folk contemporâneo, fingerstyle, guitarra tradicional, flamenco e derivações mais progressivas, explorando a forma como a música altera o espaço, o tempo e a perceção. Concertos íntimos, orgânicos e em constante mutação — o mesmo tema respira de forma diferente a cada encontro. «Fora do circuito. Dentro da ilha.»"
  organizer: "AAIP — Associação de Artistas Independentes de Portugal"
  instagram: https://www.instagram.com/auditorioamit/
  tags:
  - live-music

