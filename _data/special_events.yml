- date: 2026-06-05
  id: baca2985-26c8-4d38-afe2-6fdff8ed4fdc
  name: "FUNK THE BANKS"
  name_en: "FUNK THE BANKS"
  venue: Espaço AMIT
  address: Av. Tenente Coronel José Agostinho 6-A, 9700-108 Angra do Heroísmo
  map_url: https://www.google.com/maps/search/?api=1&query=Academia+Musical+Ilha+Terceira+Angra+do+Heroísmo
  time: "22:00–02:00"
  description: "Funk The Banks celebrates the global legacy of funk music, embracing it in full. The journey follows the genre's historical trail from its origins to the present day, crossing a vast range of cultures and social contexts. It seeks to unite human beings and planet Earth through the groovy rhythms that are the foundations of funk music."
  description_pt: "Funk The Banks celebra o espólio global da funky music abraçando-o na sua plenitude. A jornada percorre o trilho histórico do género desde as suas origens até à atualidade, atravessando um vasto leque de culturas e contextos sociais. Visa a união entre seres humanos e o planeta Terra através dos ritmos groovy que são os alicerces da funky music."
  instagram: https://www.instagram.com/auditorioamit/
  tags:
  - nightlife

