- date: 2026-04-18
  id: b5c34ce7-f073-4291-b79b-9a7af8889776
  name: "Pilot Meeting for Immigrants in Terceira"
  name_pt: "Encontro Piloto para Imigrantes na Terceira"
  venue: Auditório AMIT
  address: Av. Tenente Coronel José Agostinho 6-A, 9700-108 Angra do Heroísmo
  map_url: https://www.google.com/maps/search/?api=1&query=Academia+Musical+Ilha+Terceira+Angra+do+Heroísmo
  time: "17:00"
  description: "Welcoming, informal gathering for immigrants in Terceira. Meet new people, ask questions, and enjoy food from different cultures — bring a traditional dish from your country if you wish. During the official program, attendees are invited to come prepared with a short (~10 min) story to share: where you're from, why you chose the Azores, why Terceira, and 1–3 amazing discoveries about living on an island. Small raffle with an edible prize. Bar with traditional drinks. After the official program: music, dancing and social time. Roughly 3 hours."
  description_pt: "Encontro acolhedor e informal para imigrantes na Terceira. Conhece pessoas novas, faz perguntas e prova comida de várias culturas — traz um prato tradicional do teu país, se quiseres. Durante o programa oficial, os participantes são convidados a vir preparados com uma pequena história (~10 min) para partilhar: de onde és, porque escolheste os Açores, porquê a Terceira e 1–3 descobertas incríveis sobre viver numa ilha. Pequena rifa com um prémio comestível. Bar com bebidas tradicionais. Depois do programa oficial: música, dança e convívio. Cerca de 3 horas."
  organizer: "Olga Gvozdeva, in partnership with AIPA"
  tags:
  - food-drink

