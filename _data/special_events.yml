- date: 2026-06-06
  name: "Dia de Portugal, de Camões e das Comunidades Portuguesas 2026 — EXPO Forças Armadas"
  name_en: "Portugal Day 2026 — Armed Forces Expo"
  end_date: 2026-06-10
  venue: "Praia da Vitória"
  address: "Praia da Vitória"
  map_url: https://www.google.com/maps/search/?api=1&query=Praia+da+Vitória+Terceira
  festival: "Dia de Portugal 2026"
  description: "Five-day Armed Forces Expo at Praia da Vitória, June 6–10, as part of the national Portugal Day celebrations held on Terceira this year (with the President of the Republic in attendance). Demonstrations: explosive-ordnance neutralisation, K9 unit, climbing tower, airsoft course, ropes course, boat trips, Polaris off-road first-rides, low-altitude drone-piloting demo, scheduled visits to naval assets, and health screenings (hypertension and diabetes). Free entry."
  description_pt: "Exposição das Forças Armadas durante cinco dias na Praia da Vitória, 6 a 10 de junho, integrada nas comemorações nacionais do Dia de Portugal, este ano em Terceira (com a presença de Sua Excelência o Presidente da República). Demonstrações: inativação de engenhos explosivos, cinotécnica, torre de escalada, pista de Airsoft, pista de cordas, passeio de botes, batismo de Polaris, demonstração de pilotagem de drone de muito baixa altitude, visitas programadas ao meio naval e rastreios (hipertensão e diabetes). Entrada livre."
  organizer: "Forças Armadas Portuguesas / Câmara Municipal de Angra do Heroísmo"
  tags:
  - exhibition
  - outdoor
  - free
  - kid-friendly

