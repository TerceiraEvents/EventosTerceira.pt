  festival: "Sanjoaninas 2026"
  description: "Official opening of Sanjoaninas 2026: artillery salvo and city illumination at 21:00, philharmonic parade with the Toronto diaspora band joining the Fanfarra Operária Gago Coutinho e Sacadura Cabral and the Filarmónica dos Artistas (21:45), Opening Parade (22:00), Rainha's speech at the Town Hall, and the «Sons da Autonomia dos Açores» concert marking 50 years of Azorean Autonomy by the Orquestra de Sopros da Ilha Terceira on the Palco Continente."
