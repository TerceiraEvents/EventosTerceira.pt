name: ingest touradas calendar

# Daily ingestion of Terceira's tourada à corda calendar from individual
# junta de freguesia (parish) websites into _data/special_events.yml.
# Each parish is configured in scripts/ingest_touradas.py; the script
# scrapes each calendar page for date+keyword patterns and emits one event
# per match. Designed to coexist with the CMAH/CMPV ingests — overlapping
# entries are deduped on `(date, similar name)`.
#
# See scripts/ingest_touradas.py for the JUNTA_SOURCES list and parsing.

on:
  schedule:
    # 09:00 UTC — last in the daily ingest chain.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest-touradas
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install --quiet pyyaml==6.0.2

      - name: Run ingestion script
        run: python scripts/ingest_touradas.py

      - name: Validate _data/special_events.yml
        run: |
          ruby -ryaml -rdate <<'RUBY'
          path = "_data/special_events.yml"
          data = YAML.safe_load(File.read(path), permitted_classes: [Date, Time])
          abort "#{path}: expected top-level list, got #{data.class}" unless data.is_a?(Array)
          errors = []
          data.each_with_index do |event, i|
            name = event["name"] || "(unnamed ##{i})"
            date = event["date"]
            if date.nil?
              errors << "#{name}: missing `date` field"
              next
            end
            unless date.is_a?(Date)
              errors << "#{name}: `date` must be an unquoted ISO date, got #{date.class}"
            end
          end
          if errors.any?
            warn "event data validation failed:"
            errors.each { |e| warn "  - #{e}" }
            exit 1
          end
          puts "#{path}: OK (#{data.size} events)"
          RUBY

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/touradas-ingest
          delete-branch: true
          commit-message: "Auto-ingest new touradas calendar"
          title: "Auto-ingest: new touradas from parish calendars"
          body: |
            Automated ingestion of Terceira's tourada à corda calendar from
            junta de freguesia websites.

            This PR was opened by `.github/workflows/ingest-touradas.yml`.
            Each junta page is scraped for date patterns paired with
            tourada/bezerrada keywords; matches are emitted as
            `bullfighting` + `outdoor` events. **Review carefully** — the
            scrape is keyword-based and may pick up announcements that
            aren't actual scheduled dates.

            **Coverage:** Configured in `scripts/ingest_touradas.py` under
            `JUNTA_SOURCES`. To add a parish, append its calendar URL +
            venue/address to that list.

            **Known limitations:**
            - The scrape is heuristic; if a junta page lists past dates
              they're already filtered, but unrelated dates mentioned in
              prose can sneak through.
            - Ganadeiro attribution is extracted when present but only
              picks up the immediate `Ganadeiro: X` pattern.
            - Per-run cap: 20 events. Re-runs backfill more.

            Script: `scripts/ingest_touradas.py`
          labels: |
            automated
            events
            bullfighting
