name: ingest Whatson Azores events

# Daily ingestion of Terceira events from Azores What's On
# (https://whatson.azores.gov.pt/) into _data/special_events.yml.
# Reads every page of the website's public agenda data query and filters
# by the explicit Terceira island reference.
#
# See scripts/ingest_whatson_azores.py.

on:
  schedule:
    # 08:00 UTC — staggered 30 min after CMPV.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest-whatson-azores
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install --quiet pyyaml==6.0.2

      - name: Run ingestion script
        run: python scripts/ingest_whatson_azores.py --health-report "${{ runner.temp }}/source-health.json"

      - name: Preserve source health
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatson-source-health
          path: ${{ runner.temp }}/source-health.json

      - name: Validate _data/special_events.yml
        run: |
          ruby -ryaml -rdate <<'RUBY'
          path = "_data/special_events.yml"
          data = YAML.safe_load(File.read(path), permitted_classes: [Date, Time])
          abort "#{path}: expected top-level list, got #{data.class}" unless data.is_a?(Array)
          errors = []
          data.each_with_index do |event, i|
            name = event["name"] || "(unnamed ##{i})"
            date = event["date"]
            if date.nil?
              errors << "#{name}: missing `date` field"
              next
            end
            unless date.is_a?(Date)
              errors << "#{name}: `date` must be an unquoted ISO date, got #{date.class}"
            end
          end
          if errors.any?
            warn "event data validation failed:"
            errors.each { |e| warn "  - #{e}" }
            exit 1
          end
          puts "#{path}: OK (#{data.size} events)"
          RUBY

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: _data/special_events.yml
          branch: auto/whatson-azores-ingest
          delete-branch: true
          commit-message: "Auto-ingest new events from Azores What's On"
          title: "Auto-ingest: new events from Azores What's On"
          body: |
            Automated ingestion from https://whatson.azores.gov.pt/

            This PR was opened by `.github/workflows/ingest-whatson-azores.yml`.
            Review the added events, edit descriptions/tags as needed, then
            merge.

            **Coverage:** Regional government events portal, filtered to
            records explicitly assigned to Terceira. Catches Festivals (Sanjoaninas,
            Festas da Praia, etc.) and special programming the municipality
            sites don't always publish.

            **Known limitations:**
            - Published event dates take precedence over CMS timestamps.
              Discrete dates produce separate sessions; ambiguous dates and
              incomplete pagination fail ingestion and retain a health report.
            - Recurring programmes require weekly-data or session-level review.
            - Per-run cap: 20 events.

            Script: `scripts/ingest_whatson_azores.py`
            Health report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: |
            automated
            events
