name: validate deployed site

# Runs after a push to main has been built and deployed by GitHub
# Pages, and re-checks the SEO/structured-data invariants against the
# *live* site. The pre-merge `validate-templates.yml` workflow checks
# the build output; this one catches "build was green but production
# is wrong" — the failure mode that bit us in PRs #114, #115, #116
# where jekyll-seo-tag silently dropped fields based on config syntax.
#
# Triggered on the completion of the auto-generated
# `pages-build-deployment` workflow rather than on push, so we wait
# for Pages to actually deploy before fetching.

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Only run if the upstream Pages deploy succeeded AND it ran on
    # the main branch. (Pages also deploys preview branches; those
    # shouldn't gate this check.)
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          # Smoke test only needs net/http + json (stdlib), no bundle install.
          bundler-cache: false

      # Pages deploy completes a few seconds before the new content is
      # actually served on the CDN. A short pause + a retry-on-stale
      # check keeps this from racing the deploy.
      - name: Brief pause for CDN propagation
        run: sleep 30

      - name: Smoke-test live site
        env:
          BASE_URL: https://terceiraevents.github.io
        run: ruby scripts/tests/test_live_site.rb
