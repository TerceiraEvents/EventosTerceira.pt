name: ingest Visit Azores events

# Daily ingestion of Terceira events from Visit Azores
# (https://www.visitazores.com/) into _data/special_events.yml.
# Extracts JSON-LD `Event` blocks from the events listing and filters to
# Terceira-relevant items.
#
# See scripts/ingest_visit_azores.py + scripts/ingest_jsonld.py.

on:
  schedule:
    # 08:30 UTC — staggered 30 min after Whatson Azores.
    - cron: "30 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest-visit-azores
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install --quiet pyyaml==6.0.2

      - name: Run ingestion script
        run: python scripts/ingest_visit_azores.py

      - name: Validate _data/special_events.yml
        run: |
          ruby -ryaml -rdate <<'RUBY'
          path = "_data/special_events.yml"
          data = YAML.safe_load(File.read(path), permitted_classes: [Date, Time])
          abort "#{path}: expected top-level list, got #{data.class}" unless data.is_a?(Array)
          errors = []
          data.each_with_index do |event, i|
            name = event["name"] || "(unnamed ##{i})"
            date = event["date"]
            if date.nil?
              errors << "#{name}: missing `date` field"
              next
            end
            unless date.is_a?(Date)
              errors << "#{name}: `date` must be an unquoted ISO date, got #{date.class}"
            end
          end
          if errors.any?
            warn "event data validation failed:"
            errors.each { |e| warn "  - #{e}" }
            exit 1
          end
          puts "#{path}: OK (#{data.size} events)"
          RUBY

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/visit-azores-ingest
          delete-branch: true
          commit-message: "Auto-ingest new events from Visit Azores"
          title: "Auto-ingest: new events from Visit Azores"
          body: |
            Automated ingestion from https://www.visitazores.com/en/events

            This PR was opened by `.github/workflows/ingest-visit-azores.yml`.
            Review the added events, edit descriptions/tags as needed, then
            merge.

            **Coverage:** Regional tourism board's curated events. Tends to
            feature larger festivals, guided activities, and special
            programming aimed at visitors. Lower volume than the municipal
            feeds but useful for picking up festival anchors early.

            **Known limitations:**
            - We rely on the listing page embedding JSON-LD `Event` blocks
              for SEO. If the page becomes JS-only, the script no-ops.
            - Loose region filter; review before merging.
            - Per-run cap: 20 events.

            Script: `scripts/ingest_visit_azores.py`
          labels: |
            automated
            events
