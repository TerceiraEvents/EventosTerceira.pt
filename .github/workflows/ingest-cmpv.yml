name: ingest CMPV events

# Daily ingestion of events from the Câmara Municipal da Praia da Vitória
# (https://www.cmpv.pt/) into _data/special_events.yml. The script reads the
# public agenda's pagination and detail pages and checks calendar coverage.
# CMAH's municipal iCal does
# not cover Praia da Vitória; this fills that gap.
#
# See scripts/ingest_cmpv.py for endpoint discovery and parsing logic.

on:
  schedule:
    # 07:30 UTC — staggered 30 min after the museum ingest at 07:00.
    - cron: "30 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest-cmpv
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install --quiet pyyaml==6.0.2

      - name: Run ingestion script
        run: python scripts/ingest_cmpv.py --health-report "${{ runner.temp }}/source-health.json"

      - name: Preserve source health
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmpv-source-health
          path: ${{ runner.temp }}/source-health.json

      - name: Validate _data/special_events.yml
        run: |
          ruby -ryaml -rdate <<'RUBY'
          path = "_data/special_events.yml"
          data = YAML.safe_load(File.read(path), permitted_classes: [Date, Time])
          abort "#{path}: expected top-level list, got #{data.class}" unless data.is_a?(Array)
          errors = []
          data.each_with_index do |event, i|
            name = event["name"] || "(unnamed ##{i})"
            date = event["date"]
            if date.nil?
              errors << "#{name}: missing `date` field"
              next
            end
            unless date.is_a?(Date)
              errors << "#{name}: `date` must be an unquoted ISO date, got #{date.class}"
            end
          end
          if errors.any?
            warn "event data validation failed:"
            errors.each { |e| warn "  - #{e}" }
            exit 1
          end
          puts "#{path}: OK (#{data.size} events)"
          RUBY

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: _data/special_events.yml
          branch: auto/cmpv-ingest
          delete-branch: true
          commit-message: "Auto-ingest new events from CMPV"
          title: "Auto-ingest: new events from CMPV (Praia da Vitória)"
          body: |
            Automated ingestion from https://www.cmpv.pt/

            This PR was opened by `.github/workflows/ingest-cmpv.yml`. Review
            the added events, edit descriptions/tags as needed, then merge.

            **Coverage:** Municipal events for Praia da Vitória — the half
            of Terceira that CMAH's iCal doesn't cover. Includes Cine Clube
            sessions, Festas da Praia programming, civic exhibitions, and
            municipal sport/cultural happenings.

            **Known limitations:**
            - The script follows the public agenda's pagination and detail
              links. Blocked pages, malformed dates, and incomplete details
              fail ingestion and remain visible in the source-health report.
            - Per-run cap: 20 events. Re-runs backfill the rest.
            - Descriptions are truncated to ~500 characters.

            Script: `scripts/ingest_cmpv.py`
            Health report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: |
            automated
            events
