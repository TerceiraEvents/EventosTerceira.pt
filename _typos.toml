[default.extend-identifiers]
# Opaque id of the What's On agenda repeater (scripts/ingest_whatson_azores.py).
c09Ov7jGKeOQKPn6 = "c09Ov7jGKeOQKPn6"
# Opaque What's On record id inside two source_uid values in _data/special_events.yml.
sgUE0m0nvHbY5pSL = "sgUE0m0nvHbY5pSL"

[default]
# `lang: portugese` is a deliberate example of a bad front-matter value.
extend-ignore-re = ["lang: portugese"]

[default.extend-words]
# Portuguese word in the venue name "Escola Profissional da Praia da Vitória".
Profissional = "Profissional"

# Portuguese words in _data/special_events.yml that are also English misspellings.
# Scoped to that file so the rest of the repository keeps the default dictionary.
[type.special-events]
extend-glob = ["**/special_events.yml"]

