title: Terceira Events
description: >-
  Karaoke nights, concerts, festivals, and one-off events happening in
  Angra do Heroísmo and across Terceira Island, Açores. A community guide
  curated weekly.
tagline: What's happening on Terceira Island, Açores
author: Terceira Events
baseurl: ""
url: "https://eventosterceira.pt"
timezone: Atlantic/Azores
lang: en

markdown: kramdown
permalink: /blog/:year/:slug/

# `jekyll-seo-tag` uses `logo` for the JSON-LD `Organization.logo`
# field (small square is fine, this is for Knowledge Graph).
logo: /assets/images/apple-touch-icon.png

# NOTE: `image:` at the SITE level is ignored by jekyll-seo-tag.
# `og:image` / `twitter:image` are only emitted when `page.image` is
# present, which means a `defaults:` rule below — not a top-level key
# here. (PR #114 + #115 both set this top-level `image:` and shipped
# zero og:image tags as a result; the new CI smoke test catches that.)
# The defaults block at the bottom is what actually populates the
# meta tags.

# Plugins. Both are on the github-pages allowlist, so they'll run on
# the live site without any pages-build configuration changes.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# `image` populates `<meta property="og:image">`, `twitter:image`, and
# the BlogPosting JSON-LD `image` field via jekyll-seo-tag, which only
# reads it from `page.image` (NOT `site.image`). The empty-path
# `defaults` below makes every page get the hero photo by default.
# Per-page or per-post overrides take precedence — useful when a post
# has a flyer of its own.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/hero-angra.jpg

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  # CI caches gems under vendor/ via `bundler-cache: true`. Without
  # excluding it, Jekyll scans into the gem's own _posts template
  # stubs and the build fails with "Invalid date '...'". GitHub Pages
  # itself doesn't hit this because it installs gems outside the
  # working tree.
  - vendor
  - .bundle
  # Worktrees from local Claude Code agent runs.
  - .claude
